name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # release.yml runs the full suite before publishing anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Decides whether the SQL Server round trips are needed. A pull request that changes only documentation
  # (Markdown files, docs/, LICENSE, NOTICE) skips them: the round-trip jobs still run and report success, so the
  # required checks keep their names, but they start no SQL Server container and skip every step. Pushes to
  # master, manual runs and release builds (workflow_call) always run everything. The build job always runs:
  # its unit tests include DocsTests, which check the docs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Anything besides documentation?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: running everything."
            exit 0
          fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "Changed files:"; echo "$files"
          other="$(echo "$files" | grep -vE '(\.md$|^docs/|^LICENSE$|^NOTICE$)' || true)"
          if [ -n "$other" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Not documentation only (for example $(echo "$other" | head -1)): running the round trips."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation-only change: the SQL Server round trips are skipped."
          fi

  build:
    name: Build and unit test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BcpJson.sln

      - name: Build (warnings are errors)
        run: dotnet build BcpJson.sln -c Release --no-restore -warnaserror

      - name: Unit tests
        run: dotnet test BcpJson.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  integration:
    # Branch protection requires these checks by name ("Round trip against SQL Server 2022" etc.);
    # renaming the job or a version means updating the required checks too.
    name: Round trip against SQL Server ${{ matrix.sql }}
    needs: [build, changes]
    strategy:
      fail-fast: false
      matrix:
        sql: ["2019", "2022", "2025"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway password for the ephemeral CI container only; not a secret.
      SQL_PASSWORD: BcpJson-CI-2026x
      SQL_SERVER: localhost,1433
      # The integration tests run the self-contained single-file executable, exactly as releases ship it.
      BCPJSON: ${{ github.workspace }}/publish/bcpjson
      # roundtrip.sh writes to $RUNNER_TEMP/bcpjson-roundtrip
    services:
      mssql:
        # An empty image starts no container (documentation-only changes, see the changes job).
        image: ${{ needs.changes.outputs.code == 'true' && format('mcr.microsoft.com/mssql/server:{0}-latest', matrix.sql) || '' }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: BcpJson-CI-2026x
          MSSQL_PID: Developer
        ports:
          - 1433:1433
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.code != 'true'
        run: echo "Only documentation changed; no round trip needed."

      # The steps below that have no condition of their own run only when code changed. The later steps
      # depend on "setup", which is skipped otherwise, so they are skipped too.
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.code == 'true'
        with:
          dotnet-version: 8.0.x

      - name: Publish linux-x64 single-file executable
        if: needs.changes.outputs.code == 'true'
        run: |
          dotnet publish src/BcpJson/BcpJson.csproj -c Release -r linux-x64 -o publish
          ls -l publish
          ./publish/bcpjson --version

      - name: Install sqlcmd and bcp
        if: needs.changes.outputs.code == 'true'
        run: bash tests/integration/install-mssql-tools.sh

      - name: Wait for SQL Server
        if: needs.changes.outputs.code == 'true'
        run: |
          for i in $(seq 1 60); do
            if sqlcmd -S "$SQL_SERVER" -U sa -P "$SQL_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null; then
              echo "SQL Server is ready after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::SQL Server did not become ready."
          docker logs "${{ job.services.mssql.id }}" || true
          exit 1

      - name: Create and export the source database
        id: setup
        if: needs.changes.outputs.code == 'true'
        run: bash tests/integration/roundtrip.sh setup

      - name: Bulk load lock modes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        env:
          SQL_USER: sa
        run: ./tests/integration/lock_probe.ps1

      # The three round trips are independent: each runs whenever setup succeeded, so one failure
      # does not hide the results of the others.
      - name: JSON round trip (export, import, export)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/integration/roundtrip.sh json

      - name: BCP round trip (export, import, export)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/integration/roundtrip.sh bcp

      - name: Copy round trip (copy --snapshot with indexes, and --no-indexes)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/integration/roundtrip.sh copy

      - name: Snapshot export (point-in-time JSON and BCP)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/integration/roundtrip.sh snapshot

      - name: Snapshot consistency under concurrent writes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/integration/roundtrip.sh consistency

      - name: Resilience (manifest, verify, --resume, connection retry)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/integration/roundtrip.sh resilience

      - name: Compression (gzip JSON and BCP, streamed import, batch sizes)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/integration/roundtrip.sh compression

      - name: Split tables (key ranges and partitions)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/integration/roundtrip.sh split

      - name: Upload exported files
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: roundtrip-output-sql${{ matrix.sql }}
          path: ${{ runner.temp }}/bcpjson-roundtrip
          retention-days: 7
